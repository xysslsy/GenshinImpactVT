<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>GenshinImpactVT 本地视频测试</title>
<style>body{font:16px system-ui;max-width:800px;margin:36px auto;color:#252525}video{width:100%;background:#111}input{padding:8px;width:70%}</style>
<h1>本地视频与键盘测试</h1><p>视频由当前页面的 Canvas 和 MediaRecorder 生成，不请求远程内容。</p>
<input id="typing" placeholder="点击此处测试网页键盘输入" aria-label="键盘输入测试"><p id="status">正在生成短视频…</p>
<canvas id="source" width="640" height="360" hidden></canvas><video id="video" controls muted playsinline></video>
<script>
const canvas=document.getElementById('source'), ctx=canvas.getContext('2d'), video=document.getElementById('video');
const status=document.getElementById('status'); let frame=0;
function paint(){ctx.fillStyle=`hsl(${frame%360} 55% 30%)`;ctx.fillRect(0,0,640,360);ctx.fillStyle='white';ctx.font='28px sans-serif';ctx.fillText('GenshinImpactVT synthetic video '+frame++,30,180);}
paint(); const timer=setInterval(paint,100); const stream=canvas.captureStream(10); const chunks=[];
if(typeof MediaRecorder==='undefined'){status.textContent='当前引擎不支持 MediaRecorder';}
else {const rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
rec.onstop=()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());video.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));video.loop=true;status.textContent='视频已生成，点击播放';};
rec.start();setTimeout(()=>rec.stop(),2500);}
</script></html>
